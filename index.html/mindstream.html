<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Phantomya Gracefull – Mindstream</title>

<style>

/* =========================================
   GRUNDEINSTELLUNGEN
   ========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    padding: 20px;

    color: #00ffe0;
    background: #050505;

    font-family: Consolas, monospace;
}

h1 {
    margin: 25px 0;
    color: #ff3cac;
    text-align: center;
}

.hidden {
    display: none !important;
}


/* =========================================
   DROP-ZUGANG
   ========================================= */

.access-box {
    width: min(600px, 100%);
    margin: 30px auto;
    padding: 25px;

    border: 2px solid #00ffe0;
    background: #050505;

    box-shadow:
        0 0 30px rgba(0, 255, 224, 0.85);
}

input,
button {
    width: 100%;
    margin-top: 12px;
    padding: 12px;

    font-family: inherit;
    font-weight: bold;
}

input {
    color: #00ffe0;
    background: #000;

    border: 1px solid #00ffe0;
}

button {
    color: #000;
    background: #ff3cac;

    border: 0;
    cursor: pointer;
}

button:hover {
    background: #00ffe0;
}

#enterMindstream {
    background: #00ffe0;
}

#status {
    min-height: 20px;
    text-align: center;
    font-weight: bold;
}


/* =========================================
   MINDSTREAM
   ========================================= */

#mindstream {
    position: fixed;
    inset: 0;
    z-index: 1000;

    overflow: hidden;
    background: #000;
}


/*
   Hintergrundbild und Monitore liegen
   auf derselben 16:9-Fläche.

   Dadurch bleiben die Facebook-Inhalte
   auf Computer, Tablet und Smartphone
   in den Monitorrahmen.
*/

.room-stage {
    position: absolute;

    left: 50%;
    top: 50%;

    width: max(100vw, 177.9vh);
    aspect-ratio: 1674 / 941;

    transform: translate(-50%, -50%);

    background-image:
        linear-gradient(
            rgba(0, 0, 0, 0.03),
            rgba(0, 0, 0, 0.20)
        ),
        url("./Bilder/mindstream-room.png");

    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
}


/* =========================================
   SCANLINES
   ========================================= */

#mindstream::before {
    content: "";

    position: absolute;
    inset: 0;
    z-index: 30;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.035) 0,
            rgba(255, 255, 255, 0.035) 1px,
            transparent 1px,
            transparent 4px
        );
}


/* =========================================
   RAUMFLACKERN
   ========================================= */

#mindstream.flicker::after {
    content: "";

    position: absolute;
    inset: 0;
    z-index: 29;

    pointer-events: none;

    background:
        rgba(0, 255, 224, 0.06);

    animation:
        roomFlicker 6.7s steps(1, end) infinite;
}


/* =========================================
   BEDIENELEMENTE
   ========================================= */

.toolbar {
    position: absolute;

    top: 12px;
    left: 12px;
    right: 12px;

    z-index: 100;

    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.toolbar button {
    width: auto;
    margin: 0;
    padding: 9px 12px;

    color: #00ffe0;
    background: rgba(0, 0, 0, 0.85);

    border: 1px solid #00ffe0;
}


/* =========================================
   BILDSCHIRME
   ========================================= */

.screen {
    position: absolute;
    z-index: 10;

    overflow: hidden;

    background: #000;

    border:
        2px solid rgba(0, 255, 224, 0.45);

    box-shadow:
        0 0 15px rgba(0, 255, 224, 0.30),
        inset 0 0 20px rgba(0, 255, 224, 0.12);
}


/* Linker Monitor */

#leftScreen {
    left: 19.2%;
    top: 13.8%;

    width: 13.2%;
    height: 17.2%;

    transform: rotate(0.8deg);
}


/* Hauptmonitor */

#mainScreen {
    left: 37.3%;
    top: 11.5%;

    width: 25.9%;
    height: 25.7%;
}


/* Rechter Monitor */

#rightScreen {
    left: 68.1%;
    top: 14.1%;

    width: 13.3%;
    height: 17.1%;

    transform: rotate(-0.8deg);
}


/* Facebook-Inhalte */

.screen iframe {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;
    background: #000;

    filter:
        grayscale(1)
        contrast(1.2)
        brightness(0.72);

    opacity: 0.90;
}


/* Bildschirmstörung */

.screen-glitch {
    position: absolute;
    inset: 0;
    z-index: 20;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(255, 60, 172, 0.20),
            transparent 25%,
            transparent 75%,
            rgba(0, 255, 224, 0.20)
        );

    animation:
        screenFlicker 5.5s steps(1, end) infinite;
}


/* Unsichtbare Schaltfläche auf Seitenmonitoren */

.switch-screen {
    position: absolute;
    inset: 0;
    z-index: 25;

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    color: transparent;
    background: transparent;

    border: 0;
}


/* =========================================
   ANIMATIONEN
   ========================================= */

@keyframes roomFlicker {
    0%,
    9%,
    11%,
    42%,
    44%,
    79%,
    81%,
    100% {
        opacity: 0.80;
    }

    10%,
    43%,
    80% {
        opacity: 0.05;
    }

    10.4%,
    43.4% {
        opacity: 1;
    }
}

@keyframes screenFlicker {
    0%,
    18%,
    20%,
    62%,
    64%,
    100% {
        opacity: 0.08;
        transform: translateX(0);
    }

    19% {
        opacity: 0.65;
        transform: translateX(-2%);
    }

    63% {
        opacity: 0.50;
        transform: translateX(2%);
    }
}


/* =========================================
   TABLET
   ========================================= */

@media (max-width: 1024px) {
    body {
        padding: 16px;
    }

    h1 {
        margin: 18px 0;

        font-size:
            clamp(1.35rem, 4vw, 2rem);
    }

    .access-box {
        width: min(560px, 92vw);

        margin: 22px auto;
        padding: 22px;
    }

    .toolbar {
        top: 10px;
        left: 10px;
        right: 10px;
    }

    .toolbar button {
        padding: 8px 10px;
        font-size: 0.78rem;
    }
}


/* =========================================
   SMARTPHONE HOCHKANT
   ========================================= */

@media (max-width: 760px) and (orientation: portrait) {
    body {
        padding: 12px;
    }

    h1 {
        margin: 16px 0;

        font-size: 1.25rem;
        line-height: 1.25;
    }

    .access-box {
        width: 100%;

        margin: 16px auto;
        padding: 18px;

        box-shadow:
            0 0 18px rgba(0, 255, 224, 0.75);
    }

    input,
    button {
        min-height: 48px;
        font-size: 16px;
    }

    /*
       Im Hochformat werden die beiden seitlichen
       Monitore ausgeblendet. Der Hauptmonitor bleibt
       exakt im Hintergrundrahmen.
    */

    #leftScreen,
    #rightScreen {
        display: none;
    }

    .toolbar {
        align-items: flex-start;
    }

    .toolbar button {
        width: auto;
        max-width: 48%;
        min-height: 40px;

        padding: 7px 9px;

        font-size: 0.68rem;
        line-height: 1.15;
    }
}


/* =========================================
   SMARTPHONE QUERFORMAT
   ========================================= */

@media (max-height: 600px) and (orientation: landscape) {
    #leftScreen,
    #rightScreen {
        display: block;
    }

    .toolbar button {
        min-height: 36px;

        padding: 6px 9px;

        font-size: 0.66rem;
    }
}

</style>
</head>

<body>

<h1>Phantomya Gracefull – Mindstream</h1>


<!-- =====================================
     DROP-ZUGANG
     ===================================== -->

<div class="access-box">

    <p>DROP // ENTER ACCESS CODE</p>

    <input
        id="codeInput"
        type="text"
        placeholder="Enter Access Code"
        autocomplete="off"
    >

    <button id="decryptButton">
        DECRYPT
    </button>

    <p id="status"></p>

    <button
        id="enterMindstream"
        class="hidden"
    >
        ENTER MINDSTREAM
    </button>

</div>


<!-- =====================================
     MINDSTREAM
     ===================================== -->

<section
    id="mindstream"
    class="hidden flicker"
>

    <div class="toolbar">

        <button id="flickerButton">
            SIGNAL INSTABILITY: ON
        </button>

        <button id="leaveButton">
            LEAVE MINDSTREAM
        </button>

    </div>


    <!-- Hintergrund und Monitore -->

    <div class="room-stage">


        <!-- LINKER BILDSCHIRM -->

        <div
            class="screen"
            id="leftScreen"
        >

            <iframe
                id="leftPlayer"
                title="Facebook-Beitrag links"
                allow="encrypted-media; fullscreen"
                allowfullscreen
            ></iframe>

            <div class="screen-glitch"></div>

            <button
                class="switch-screen"
                data-screen="left"
                title="Auf Hauptbildschirm anzeigen"
            >
                Wechseln
            </button>

        </div>


        <!-- HAUPTBILDSCHIRM -->

        <div
            class="screen"
            id="mainScreen"
        >

            <iframe
                id="mainPlayer"
                title="Facebook-Hauptbeitrag"
                allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                allowfullscreen
            ></iframe>

            <div class="screen-glitch"></div>

        </div>


        <!-- RECHTER BILDSCHIRM -->

        <div
            class="screen"
            id="rightScreen"
        >

            <iframe
                id="rightPlayer"
                title="Facebook-Beitrag rechts"
                allow="encrypted-media; fullscreen"
                allowfullscreen
            ></iframe>

            <div class="screen-glitch"></div>

            <button
                class="switch-screen"
                data-screen="right"
                title="Auf Hauptbildschirm anzeigen"
            >
                Wechseln
            </button>

        </div>

    </div>

</section>


<script>

/* =========================================
   ZWEI DROPS
   ========================================= */

const drops = {

    /* DROP 01 */

    "4U9525": {
        name: "DROP 01",

        left:
            "https://www.facebook.com/reel/1809023703111797",

        main:
            "https://www.facebook.com/photo/?fbid=1481728967325169&set=a.633529515478456",

        right:
            "https://www.facebook.com/reel/1035969792734203"
    },


    /* DROP 02 */

    "HURTZ2026": {
        name: "DROP 02",

        left:
            "https://www.facebook.com/photo?fbid=1345851983569173&set=pcb.1345852566902448",

        main:
            "https://www.facebook.com/photo?fbid=1345851983569173&set=pcb.1345852566902448",

        right:
            "https://www.facebook.com/photo?fbid=1345851983569173&set=pcb.1345852566902448"
    },

 "N3ONVOID26": {
        name: "DROP 01",

        left:
            "https://www.facebook.com/photo/?fbid=1892229088867398&set=a.599798814777105",
            

        main:
            "https://www.facebook.com/reel/1609133750178290"

        right:
            "https://www.facebook.com/photo/?fbid=10243869630106604&set=a.2169130558250"
    },

};


/* Aktuell ausgewählte Bildschirm-Inhalte */

let links = {
    left: "",
    main: "",
    right: ""
};


/* =========================================
   ELEMENTE
   ========================================= */

const codeInput =
    document.getElementById("codeInput");

const decryptButton =
    document.getElementById("decryptButton");

const enterButton =
    document.getElementById("enterMindstream");

const status =
    document.getElementById("status");

const mindstream =
    document.getElementById("mindstream");

const leftPlayer =
    document.getElementById("leftPlayer");

const mainPlayer =
    document.getElementById("mainPlayer");

const rightPlayer =
    document.getElementById("rightPlayer");


/* =========================================
   FACEBOOK-EINBETTUNG
   ========================================= */

function createFacebookEmbed(url, autoplay) {
    const isVideo =
        url.includes("/reel/") ||
        url.includes("/videos/") ||
        url.includes("/watch");

    const plugin =
        isVideo
            ? "video.php"
            : "post.php";

    return (
        "https://www.facebook.com/plugins/" +
        plugin +
        "?href=" +
        encodeURIComponent(url) +
        "&show_text=false" +
        "&width=960" +
        "&autoplay=" +
        (autoplay ? "true" : "false")
    );
}


/* =========================================
   BILDSCHIRME LADEN
   ========================================= */

function loadScreens() {
    leftPlayer.src =
        createFacebookEmbed(
            links.left,
            false
        );

    mainPlayer.src =
        createFacebookEmbed(
            links.main,
            true
        );

    rightPlayer.src =
        createFacebookEmbed(
            links.right,
            false
        );
}


/* =========================================
   ZUGANG PRÜFEN
   ========================================= */

decryptButton.addEventListener(
    "click",
    function () {
        const enteredCode =
            codeInput.value
                .trim()
                .toUpperCase();

        const selectedDrop =
            drops[enteredCode];

        if (selectedDrop) {
            links = {
                left: selectedDrop.left,
                main: selectedDrop.main,
                right: selectedDrop.right
            };

            status.textContent =
                selectedDrop.name +
                " // ACCESS GRANTED";

            status.style.color =
                "#00ffe0";

            enterButton.classList.remove(
                "hidden"
            );
        } else {
            status.textContent =
                "ACCESS DENIED";

            status.style.color =
                "#ff3cac";

            enterButton.classList.add(
                "hidden"
            );
        }
    }
);


/* =========================================
   MINDSTREAM BETRETEN
   ========================================= */

enterButton.addEventListener(
    "click",
    function () {
        loadScreens();

        mindstream.classList.remove(
            "hidden"
        );
    }
);


/* =========================================
   MINDSTREAM VERLASSEN
   ========================================= */

document
    .getElementById("leaveButton")
    .addEventListener(
        "click",
        function () {
            mindstream.classList.add(
                "hidden"
            );

            leftPlayer.src = "";
            mainPlayer.src = "";
            rightPlayer.src = "";
        }
    );


/* =========================================
   FLACKERN EIN/AUS
   ========================================= */

document
    .getElementById("flickerButton")
    .addEventListener(
        "click",
        function (event) {
            const active =
                mindstream.classList.toggle(
                    "flicker"
                );

            event.currentTarget.textContent =
                "SIGNAL INSTABILITY: " +
                (active ? "ON" : "OFF");
        }
    );


/* =========================================
   SEITENMONITOR TAUSCHEN
   ========================================= */

document
    .querySelectorAll(".switch-screen")
    .forEach(function (button) {
        button.addEventListener(
            "click",
            function () {
                const side =
                    button.dataset.screen;

                const oldMain =
                    links.main;

                links.main =
                    links[side];

                links[side] =
                    oldMain;

                loadScreens();
            }
        );
    });


/* =========================================
   ENTER-TASTE
   ========================================= */

codeInput.addEventListener(
    "keydown",
    function (event) {
        if (event.key === "Enter") {
            decryptButton.click();
        }
    }
);

</script>

</body>
</html>

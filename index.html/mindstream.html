<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phantomya Gracefull – Mindstream</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;padding:20px;color:#00ffe0;background:#050505;font-family:Consolas,monospace}h1{margin:25px 0;color:#ff3cac;text-align:center}.hidden{display:none!important}.access-box{width:min(600px,100%);margin:30px auto;padding:25px;border:2px solid #00ffe0;background:#050505;box-shadow:0 0 30px rgba(0,255,224,.85);text-align:center}.access-box button{width:100%;margin-top:12px;padding:12px;font-family:inherit;font-weight:bold;color:#000;background:#ff3cac;border:0;cursor:pointer}.access-box button:hover{background:#00ffe0}.notice{color:#aaa;font-size:.9rem;line-height:1.5}#mindstream{position:fixed;inset:0;z-index:1000;overflow:hidden;background:#000}.room-stage{position:absolute;left:50%;top:50%;width:max(100vw,177.9vh);aspect-ratio:1674/941;transform:translate(-50%,-50%);background-image:linear-gradient(rgba(0,0,0,.03),rgba(0,0,0,.20)),url("./Bilder/mindstream-room.png");background-size:100% 100%;background-position:center;background-repeat:no-repeat}#mindstream::before{content:"";position:absolute;inset:0;z-index:30;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 1px,transparent 1px,transparent 4px)}#mindstream.flicker::after{content:"";position:absolute;inset:0;z-index:29;pointer-events:none;background:rgba(0,255,224,.06);animation:roomFlicker 6.7s steps(1,end) infinite}.toolbar{position:absolute;top:12px;left:12px;right:12px;z-index:100;display:flex;justify-content:space-between;gap:10px}.toolbar button{width:auto;margin:0;padding:9px 12px;color:#00ffe0;background:rgba(0,0,0,.85);border:1px solid #00ffe0;cursor:pointer}.screen{position:absolute;z-index:10;overflow:hidden;background:#000;border:2px solid rgba(0,255,224,.45);box-shadow:0 0 15px rgba(0,255,224,.30),inset 0 0 20px rgba(0,255,224,.12)}#leftScreen{left:19.2%;top:12.5%;width:13.2%;height:17.2%;transform:rotate(.8deg)}#mainScreen{left:37.3%;top:11.5%;width:25.9%;height:25.7%}#rightScreen{left:68.1%;top:12.8%;width:13.3%;height:17.1%;transform:rotate(-.8deg)}.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;filter:grayscale(1) contrast(1.2) brightness(.72);opacity:.90}.screen-glitch{position:absolute;inset:0;z-index:20;pointer-events:none;background:linear-gradient(90deg,rgba(255,60,172,.20),transparent 25%,transparent 75%,rgba(0,255,224,.20));animation:screenFlicker 5.5s steps(1,end) infinite}.switch-screen{position:absolute;inset:0;z-index:25;width:100%;height:100%;margin:0;padding:0;color:transparent;background:transparent;border:0;cursor:pointer}@keyframes roomFlicker{0%,9%,11%,42%,44%,79%,81%,100%{opacity:.80}10%,43%,80%{opacity:.05}10.4%,43.4%{opacity:1}}@keyframes screenFlicker{0%,18%,20%,62%,64%,100%{opacity:.08;transform:translateX(0)}19%{opacity:.65;transform:translateX(-2%)}63%{opacity:.50;transform:translateX(2%)}}@media(max-width:1024px){body{padding:16px}h1{margin:18px 0;font-size:clamp(1.35rem,4vw,2rem)}.access-box{width:min(560px,92vw);margin:22px auto;padding:22px}.toolbar{top:10px;left:10px;right:10px}.toolbar button{padding:8px 10px;font-size:.78rem}}@media(max-width:760px) and (orientation:portrait){body{padding:12px}h1{margin:16px 0;font-size:1.25rem;line-height:1.25}.access-box{width:100%;margin:16px auto;padding:18px;box-shadow:0 0 18px rgba(0,255,224,.75)}.access-box button{min-height:48px;font-size:16px}#leftScreen,#rightScreen{display:none}.toolbar{align-items:flex-start}.toolbar button{width:auto;max-width:48%;min-height:40px;padding:7px 9px;font-size:.68rem;line-height:1.15}}@media(max-height:600px) and (orientation:landscape){#leftScreen,#rightScreen{display:block}.toolbar button{min-height:36px;padding:6px 9px;font-size:.66rem}}
</style>
</head>
<body>
<h1>Phantomya Gracefull – Mindstream</h1>
<div class="access-box">
  <p>CURRENT DROP // PUBLIC EDITION</p>
  <p class="notice">Diese Ausgabe ist öffentlich. Es wird kein Zugangscode im Browser gespeichert oder vorgetäuscht.</p>
  <button id="enterMindstream">ENTER MINDSTREAM</button>
</div>

<section id="mindstream" class="hidden flicker">
  <div class="toolbar">
    <button id="flickerButton">SIGNAL INSTABILITY: ON</button>
    <button id="leaveButton">LEAVE MINDSTREAM</button>
  </div>
  <div class="room-stage">
    <div class="screen" id="leftScreen">
      <iframe id="leftPlayer" title="Mindstream links" allow="encrypted-media; fullscreen" allowfullscreen></iframe>
      <div class="screen-glitch"></div>
      <button class="switch-screen" data-screen="left" title="Auf Hauptbildschirm anzeigen">Wechseln</button>
    </div>
    <div class="screen" id="mainScreen">
      <iframe id="mainPlayer" title="Freiheit – Lincoln und die Maschine" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
      <div class="screen-glitch"></div>
    </div>
    <div class="screen" id="rightScreen">
      <iframe id="rightPlayer" title="Mindstream rechts" allow="encrypted-media; fullscreen" allowfullscreen></iframe>
      <div class="screen-glitch"></div>
      <button class="switch-screen" data-screen="right" title="Auf Hauptbildschirm anzeigen">Wechseln</button>
    </div>
  </div>
</section>

<script>
const currentDrop={
  name:"FREIHEIT // LINCOLN × DIE MASCHINE",
  left:"https://www.facebook.com/photo?fbid=29620155320907789&set=a.814048135278558",
  main:"./mindstream-freiheit.html",
  right:"https://www.facebook.com/photo/?fbid=3633238683519699&set=gm.1560451498706377&idorvanity=228817131869827"
};

let links={left:currentDrop.left,main:currentDrop.main,right:currentDrop.right};
const enterButton=document.getElementById("enterMindstream");
const mindstream=document.getElementById("mindstream");
const leftPlayer=document.getElementById("leftPlayer");
const mainPlayer=document.getElementById("mainPlayer");
const rightPlayer=document.getElementById("rightPlayer");

function createEmbed(url,autoplay){
  if(!url)return "about:blank";
  if(url.startsWith("./")||url.startsWith("/"))return url;
  if(url.includes("facebook.com/profile.php")){
    return "https://www.facebook.com/plugins/page.php?href="+encodeURIComponent(url)+"&tabs=timeline&width=960&height=720&small_header=true&adapt_container_width=true&hide_cover=false&show_facepile=false";
  }
  if(url.includes("facebook.com/")){
    const isVideo=url.includes("/reel/")||url.includes("/videos/")||url.includes("/watch");
    const plugin=isVideo?"video.php":"post.php";
    return "https://www.facebook.com/plugins/"+plugin+"?href="+encodeURIComponent(url)+"&show_text=false&width=960&autoplay="+(autoplay?"true":"false");
  }
  return "about:blank";
}

function setScreen(player,url,autoplay){
  player.removeAttribute("srcdoc");
  player.src=createEmbed(url,autoplay);
}

function loadScreens(){
  setScreen(leftPlayer,links.left,false);
  setScreen(mainPlayer,links.main,true);
  setScreen(rightPlayer,links.right,false);
}

enterButton.addEventListener("click",function(){
  loadScreens();
  mindstream.classList.remove("hidden");
});

document.getElementById("leaveButton").addEventListener("click",function(){
  mindstream.classList.add("hidden");
  leftPlayer.src="";
  mainPlayer.src="";
  rightPlayer.src="";
});

document.getElementById("flickerButton").addEventListener("click",function(event){
  const active=mindstream.classList.toggle("flicker");
  event.currentTarget.textContent="SIGNAL INSTABILITY: "+(active?"ON":"OFF");
});

document.querySelectorAll(".switch-screen").forEach(function(button){
  button.addEventListener("click",function(){
    const side=button.dataset.screen;
    const oldMain=links.main;
    links.main=links[side];
    links[side]=oldMain;
    loadScreens();
  });
});
</script>
</body>
</html>

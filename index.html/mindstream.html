eft:37.3%;top:11.5%;width:25.9%;height:25.7%}#rightScreen{left:68.1%;top:12.8%;width:13.3%;height:17.1%;transform:rotate(-.8deg)}.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;filter:grayscale(1) contrast(1.2) brightness(.72);opacity:.90}.screen-glitch{position:absolute;inset:0;z-index:20;pointer-events:none;background:linear-gradient(90deg,rgba(255,60,172,.20),transparent 25%,transparent 75%,rgba(0,255,224,.20));animation:screenFlicker 5.5s steps(1,end) infinite}.switch-screen{position:absolute;inset:0;z-index:25;width:100%;height:100%;margin:0;padding:0;color:transparent;background:transparent;border:0}@keyframes roomFlicker{0%,9%,11%,42%,44%,79%,81%,100%{opacity:.80}10%,43%,80%{opacity:.05}10.4%,43.4%{opacity:1}}@keyframes screenFlicker{0%,18%,20%,62%,64%,100%{opacity:.08;transform:translateX(0)}19%{opacity:.65;transform:translateX(-2%)}63%{opacity:.50;transform:translateX(2%)}}@media(max-width:1024px){body{padding:16px}h1{margin:18px 0;font-size:clamp(1.35rem,4vw,2rem)}.access-box{width:min(560px,92vw);margin:22px auto;padding:22px}.toolbar{top:10px;left:10px;right:10px}.toolbar button{padding:8px 10px;font-size:.78rem}}@media(max-width:760px) and (orientation:portrait){body{padding:12px}h1{margin:16px 0;font-size:1.25rem;line-height:1.25}.access-box{width:100%;margin:16px auto;padding:18px;box-shadow:0 0 18px rgba(0,255,224,.75)}input,button{min-height:48px;font-size:16px}#leftScreen,#rightScreen{display:none}.toolbar{align-items:flex-start}.toolbar button{width:auto;max-width:48%;min-height:40px;padding:7px 9px;font-size:.68rem;line-height:1.15}}@media(max-height:600px) and (orientation:landscape){#leftScreen,#rightScreen{display:block}.toolbar button{min-height:36px;padding:6px 9px;font-size:.66rem}}

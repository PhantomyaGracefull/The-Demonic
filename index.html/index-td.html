<script>
const cards = document.querySelectorAll('.mission-card');
const zoom = document.querySelector('.mission-zoom');
const output = document.getElementById('mission-output');
const codeInput = document.getElementById('codeInput');
const status = document.getElementById('status');
const fbLink = document.getElementById('fb-link');

// UTF-8 sichere Base64 Dekodierung
function b64_to_utf8(str) {
    const decoded = atob(str);
    const uint8Array = Uint8Array.from(decoded, c => c.charCodeAt(0));
    return new TextDecoder().decode(uint8Array);
}

// Performanter Typing-Effekt
function typeText(element, text) {
    let i = 0;
    element.textContent = '';
    function step() {
        element.textContent += text[i];
        i++;
        if (i < text.length) requestAnimationFrame(step);
    }
    step();
}

// Drop-Karten Klickhandler
cards.forEach(card => {
    card.addEventListener('click', () => {
        zoom.classList.remove('hidden');
        output.textContent = '';
        codeInput.value = '';
        status.textContent = '';
        fbLink.href = card.dataset.fblink || '#';
        currentMessage = card.dataset.message.trim();
        currentCode = card.dataset.code;

        if(card.dataset.video){
            const video = document.getElementById('mission-video');
            const source = document.getElementById('video-source');
            source.src = card.dataset.video;
            video.load();
            video.classList.remove('hidden');
        } else {
            document.getElementById('mission-video').classList.add('hidden');
        }
    });
});

let currentMessage = '';
let currentCode = '';

// DECRYPT Button
document.getElementById('decodeBtn').addEventListener('click', () => {
    if(codeInput.value === currentCode){
        try {
            const decoded = b64_to_utf8(currentMessage);
            typeText(output, decoded);
            status.textContent = "ACCESS GRANTED";
            status.style.color="#00ffe0";
        } catch(e){
            status.textContent = "DECODE ERROR";
            status.style.color="#ff3cac";
            console.error(e);
        }
    } else {
        status.textContent = "ACCESS DENIED";
        status.style.color="#ff3cac";
    }
});

// CLOSE Button
document.getElementById('closeBtn').addEventListener('click', ()=>{
    zoom.classList.add('hidden');
});

cards.forEach(card => {
    card.clickCount = 0; // initialisieren

    // Element für die Klickanzeige erstellen
    let clickDisplay = document.createElement('span');
    clickDisplay.className = 'card-clicks';
    clickDisplay.textContent = "Klicks: 0";
    card.appendChild(clickDisplay);

    card.addEventListener('click', () => {
        // Klick zählen
        card.clickCount++;
        clickDisplay.textContent = "Klicks: " + card.clickCount;

        // Dein bestehender Zoom-Handler
        zoom.classList.remove('hidden');
        output.textContent = '';
        codeInput.value = '';
        status.textContent = '';
        fbLink.href = card.dataset.fblink || '#';
        currentMessage = card.dataset.message.trim();
        currentCode = card.dataset.code;

        if(card.dataset.video){
            const video = document.getElementById('mission-video');
            const source = document.getElementById('video-source');
            source.src = card.dataset.video;
            video.load();
            video.classList.remove('hidden');
        } else {
            document.getElementById('mission-video').classList.add('hidden');
        }
    });
});
</script>

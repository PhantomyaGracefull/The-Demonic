<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CYBER OPS // NEON TERMINAL</title>
<style>
body {
    background: linear-gradient(135deg, #050505 0%, #0a0a0a 50%, #050505 100%);
    color: #00ffe0;
    font-family: "Courier New", monospace;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* --- MISSION BOARD --- */
.mission-board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 15px;
    padding: 20px;
    max-height: 85vh;
    overflow-y: auto;
    width: 95%;
    max-width: 1000px;
}

.mission-card {
    background: rgba(0,0,0,0.8);
    border: 2px solid #00ffe0; /* Türkis */
    color: #ff3cac;            /* Pink */
    padding: 15px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.3s;
    font-size: 0.85rem;
}

.mission-card:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px #00ffe0, 0 0 40px #ff3cac;
}

/* --- ZOOM TERMINAL --- */
.mission-zoom {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    padding: 25px;
    background: rgba(0,0,0,0.95);
    border: 2px solid #00ffe0;
    box-shadow: 0 0 30px #00ffe0, 0 0 50px #ff3cac;
    z-index: 100;
}

.hidden { display: none; }

.terminal {
    background: black;
    padding: 15px;
    margin-top: 15px;
    border: 1px solid #00ffe0;
    height: 120px;
    overflow-y: auto;
    white-space: pre-wrap;
    font-size: 0.9rem;
}

input {
    width: 100%;
    margin-top: 15px;
    padding: 10px;
    background: black;
    color: #00ffe0;
    border: 1px solid #00ffe0;
}

input:focus {
    outline: none;
    border-color: #00ffe0;
    box-shadow: 0 0 10px #00ffe0;
}

button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: #ff3cac;  /* Pink */
    color: black;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #00ffe0;  /* Türkis */
    box-shadow: 0 0 15px #00ffe0, 0 0 25px #ff3cac;
}

.status {
    margin-top: 10px;
    font-weight: bold;
}

#fb-link {
    display: block;
    margin-top: 10px;
    color: #00ffe0;
    text-decoration: none;
    font-weight: bold;
    text-align: center;
    border: 1px solid #00ffe0;
    padding: 8px;
    transition: all 0.2s;
}

#fb-link:hover {
    color: black;
    background: #00ffe0;
    box-shadow: 0 0 10px #00ffe0, 0 0 20px #ff3cac;
}

/* --- GLITCH EFFECT --- */
.glitch {
    animation: glitch 1s infinite;
    color: #00ffe0;
    text-shadow: 2px 0 #ff3cac, -2px 0 #00ffe0;
}

@keyframes glitch {
    0% { text-shadow: 2px 0 #ff3cac; }
    50% { text-shadow: -2px 0 #00ffe0; }
    100% { text-shadow: 2px 0 #ff3cac; }
}
</style>
</head>

 </div>

<!-- ZOOM TERMINAL -->
<div class="mission-zoom hidden">
    <h2 class="glitch">Transmission Data</h2>
    <div class="terminal" id="mission-output"></div>
    <input type="text" id="codeInput" placeholder="Enter Access Code">
    <a href="https://www.facebook.com/profile.php?id=100003067088819" target="_blank" id="fb-link">💻 GET ACCESS CODE ON FACEBOOK</a>
    <button id="decodeBtn">DECRYPT</button>
    <button id="closeBtn">BACK</button>
    <p id="status" class="status"></p>
</div>

<script>
const cards = document.querySelectorAll('.mission-card');
const zoom = document.querySelector('.mission-zoom');
const output = document.getElementById('mission-output');
const codeInput = document.getElementById('codeInput');
const status = document.getElementById('status');

let currentMessage = '';
let currentCode = '';

cards.forEach(card => {
    card.addEventListener('click', () => {
        zoom.classList.remove('hidden');
        currentMessage = card.dataset.message;
        currentCode = card.dataset.code;
        output.textContent = currentMessage; // Base64 anzeigen
        codeInput.value = '';
        status.textContent = '';
    });
});

document.getElementById('decodeBtn').addEventListener('click', () => {
    if (codeInput.value === currentCode) {
        let decoded = atob(currentMessage);
        output.textContent = '';
        let i = 0;
        let interval = setInterval(() => {
            output.textContent += decoded[i];
            i++;
            if (i >= decoded.length) clearInterval(interval);
        }, 30);
        status.textContent = "ACCESS GRANTED";
        status.style.color = "#00ffe0";
    } else {
        status.textContent = "ACCESS DENIED";
        status.style.color = "#ff3cac";
    }
});

document.getElementById('closeBtn').addEventListener('click', () => {
    zoom.classList.add('hidden');
});
</script>
